name: Build Batteries (linux_32)
# 🤖 Build import artifacts with the native i386 toolchain from a tested browser run.
on:
  workflow_dispatch:
    inputs:
      toolchain_run_id:
        description: 'Browser toolchain run id with successful WASM and Linux 32bit jobs'
        required: true
      batteries_rev:
        description: 'Optional full Batteries revision; defaults to the pinned Mathlib dependency'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve source pins and verify input jobs
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_RUN_ID: ${{ inputs.toolchain_run_id }}
          REQUESTED_BATTERIES_REV: ${{ inputs.batteries_rev }}
        run: |
          [[ "$TOOLCHAIN_RUN_ID" =~ ^[0-9]+$ ]]
          LOCK=.github/browser-mathlib-manifold-closure.lock.json
          LEAN_UPSTREAM_COMMIT=$(jq -er '.lean.upstreamCommit' "$LOCK")
          MATHLIB_COMMIT=$(jq -er '.mathlib.commit' "$LOCK")
          test "$(jq -r '.mathlib.repository' "$LOCK")" = https://github.com/leanprover-community/mathlib4.git
          gh api "repos/leanprover-community/mathlib4/contents/lake-manifest.json?ref=$MATHLIB_COMMIT" \
            -H 'Accept: application/vnd.github.raw+json' > mathlib-lake-manifest.json
          LOCKED_BATTERIES_REV=$(jq -er '.packages[] | select(.name == "batteries") | .rev' mathlib-lake-manifest.json)
          BATTERIES_REV=${REQUESTED_BATTERIES_REV:-$LOCKED_BATTERIES_REV}
          [[ "$BATTERIES_REV" =~ ^[0-9a-f]{40}$ ]]
          RUN=$(gh api "repos/${{ github.repository }}/actions/runs/$TOOLCHAIN_RUN_ID")
          test "$(jq -r '.repository.full_name' <<< "$RUN")" = "${{ github.repository }}"
          test "$(jq -r '.head_repository.full_name' <<< "$RUN")" = "${{ github.repository }}"
          test "$(jq -r '.path' <<< "$RUN")" = .github/workflows/browser.yml
          LEAN_COMMIT=$(jq -er '.head_sha' <<< "$RUN")
          COMPARE_STATUS=$(gh api "repos/${{ github.repository }}/compare/$LEAN_UPSTREAM_COMMIT...$LEAN_COMMIT" --jq '.status')
          [[ "$COMPARE_STATUS" == ahead || "$COMPARE_STATUS" == identical ]]
          RUN_JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/$TOOLCHAIN_RUN_ID/jobs?per_page=100")
          for JOB_NAME in 'Web Assembly' 'Linux 32bit'
          do
            jq -e --arg name "$JOB_NAME" \
              '[.jobs[] | select((.name == ("build / " + $name) or .name == ("build-secondary / " + $name)) and .conclusion == "success")] | length == 1' \
              <<< "$RUN_JOBS"
          done
          {
            echo "LEAN_COMMIT=$LEAN_COMMIT"
            echo "BATTERIES_REV=$BATTERIES_REV"
            echo "LOCKED_BATTERIES_REV=$LOCKED_BATTERIES_REV"
            echo "MATHLIB_COMMIT=$MATHLIB_COMMIT"
          } >> "$GITHUB_ENV"
      - name: Install i386 runtime
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 zlib1g:i386 libuv1:i386 libssl3t64:i386 zstd gcc-multilib g++-multilib
      - name: Download toolchain artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_RUN_ID: ${{ inputs.toolchain_run_id }}
        run: gh run download "$TOOLCHAIN_RUN_ID" -R "${{ github.repository }}" -n "build-Linux 32bit" -D artifact
      - name: Extract and verify toolchain
        run: |
          test "$(find artifact -maxdepth 1 -name '*.tar.zst' | wc -l)" -eq 1
          mkdir toolchain
          tar --use-compress-program=unzstd -xf artifact/*.tar.zst -C toolchain --strip-components=1
          TOOLCHAIN="$PWD/toolchain"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          file "$TOOLCHAIN/bin/lean" | grep 'ELF 32-bit'
          "$TOOLCHAIN/bin/lean" --version
          "$TOOLCHAIN/bin/lean" --githash > native-githash.txt
          grep -qx "$LEAN_COMMIT" native-githash.txt
      - name: Checkout exact Batteries source
        run: |
          git init batteries
          git -C batteries remote add origin https://github.com/leanprover-community/batteries.git
          git -C batteries fetch --depth=1 origin "$BATTERIES_REV"
          git -C batteries checkout --detach FETCH_HEAD
          test "$(git -C batteries rev-parse HEAD)" = "$BATTERIES_REV"
      - name: Build Batteries
        run: |
          export PATH="$TOOLCHAIN/bin:$PATH"
          cd batteries
          lake build Batteries
          printf 'import Batteries\n' > browser-import-check.lean
          lake env lean browser-import-check.lean
      - name: Package import artifacts and provenance
        env:
          TOOLCHAIN_RUN_ID: ${{ inputs.toolchain_run_id }}
        run: |
          mkdir batteries-artifacts
          cd batteries/.lake/build/lib/lean
          find . \( -name '*.olean' -o -name '*.ir' -o -name '*.ir.sig' \) | sort | tar -cf - -T - | zstd -19 -T0 -o "$GITHUB_WORKSPACE/batteries-artifacts/batteries-oleans-linux_32.tar.zst"
          cd "$GITHUB_WORKSPACE"
          jq -n \
            --arg repository "${{ github.repository }}" \
            --arg lean "$LEAN_COMMIT" \
            --arg workflow "$(git rev-parse HEAD)" \
            --arg run "$TOOLCHAIN_RUN_ID" \
            --arg batteries "$BATTERIES_REV" \
            --arg toolchain "$(cat batteries/lean-toolchain)" \
            --arg mathlib "$MATHLIB_COMMIT" \
            --arg lockedBatteries "$LOCKED_BATTERIES_REV" \
            '{schemaVersion: 1, lean: {repository: $repository, commit: $lean, workflowCommit: $workflow, toolchainRunId: $run}, batteries: {commit: $batteries, sourceToolchain: $toolchain, mathlibCommit: $mathlib, mathlibDependencyCommit: $lockedBatteries}}' \
            > batteries-artifacts/manifest.json
          cd batteries-artifacts
          sha256sum manifest.json ./*.tar.zst > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: batteries-oleans-linux_32
          path: batteries-artifacts
          if-no-files-found: error
          retention-days: 30
