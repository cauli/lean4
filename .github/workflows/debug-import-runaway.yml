name: Debug import runaway (native i386)
# 🤖 Probe a public module with a tested i386 toolchain and bounded memory/time.
on:
  workflow_dispatch:
    inputs:
      toolchain_run_id:
        description: 'Run id with a successful Linux 32bit toolchain job'
        required: true
      import_target:
        description: 'Public module to import in the probe file'
        required: true
        default: 'Init.Prelude'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify input job and module name
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_RUN_ID: ${{ inputs.toolchain_run_id }}
          IMPORT_TARGET: ${{ inputs.import_target }}
        run: |
          [[ "$TOOLCHAIN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$IMPORT_TARGET" =~ ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$ ]]
          RUN=$(gh api "repos/${{ github.repository }}/actions/runs/$TOOLCHAIN_RUN_ID")
          test "$(jq -r '.repository.full_name' <<< "$RUN")" = "${{ github.repository }}"
          test "$(jq -r '.head_repository.full_name' <<< "$RUN")" = "${{ github.repository }}"
          test "$(jq -r '.path' <<< "$RUN")" = .github/workflows/browser.yml
          LEAN_COMMIT=$(jq -er '.head_sha' <<< "$RUN")
          gh api "repos/${{ github.repository }}/actions/runs/$TOOLCHAIN_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select((.name == "build / Linux 32bit" or .name == "build-secondary / Linux 32bit") and .conclusion == "success")] | length' \
            | grep -qx 1
          echo "LEAN_COMMIT=$LEAN_COMMIT" >> "$GITHUB_ENV"
      - name: Install i386 runtime and valgrind
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 zlib1g:i386 libuv1:i386 libssl3t64:i386 zstd valgrind libc6-dbg:i386
      - name: Download toolchain artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_RUN_ID: ${{ inputs.toolchain_run_id }}
        run: gh run download "$TOOLCHAIN_RUN_ID" -R "${{ github.repository }}" -n "build-Linux 32bit" -D artifact
      - name: Extract and verify toolchain
        run: |
          test "$(find artifact -maxdepth 1 -name '*.tar.zst' | wc -l)" -eq 1
          mkdir toolchain
          tar --use-compress-program=unzstd -xf artifact/*.tar.zst -C toolchain --strip-components=1
          TOOLCHAIN="$PWD/toolchain"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          file "$TOOLCHAIN/bin/lean" | grep 'ELF 32-bit'
          "$TOOLCHAIN/bin/lean" --version
          "$TOOLCHAIN/bin/lean" --githash > native-githash.txt
          grep -qx "$LEAN_COMMIT" native-githash.txt
      - name: 'Probe 1: plain run, 3GB address-space cap, peak RSS'
        env:
          IMPORT_TARGET: ${{ inputs.import_target }}
        run: |
          printf 'import %s\n' "$IMPORT_TARGET" > probe.lean
          export LEAN_PATH="$TOOLCHAIN/lib/lean"
          set +e
          ( ulimit -v 3145728; timeout 120 /usr/bin/time -v "$TOOLCHAIN/bin/lean" probe.lean ) 2>&1 | tail -25
          code=${PIPESTATUS[0]}
          set -e
          echo "exit code: $code"
          if [ "$code" -eq 0 ]; then
            echo "Native import completed within the memory and time limits."
          else
            echo "Native import failed or hit a limit. Inspect the error before attributing the cause."
          fi
          echo "code=$code" >> "$GITHUB_ENV"
      - name: 'Probe 2: valgrind massif allocation tree (only on failure)'
        if: env.code != '0'
        run: |
          export LEAN_PATH="$TOOLCHAIN/lib/lean"
          timeout 600 valgrind --tool=massif --threshold=2.0 \
            --massif-out-file=massif.out "$TOOLCHAIN/bin/lean" probe.lean || true
          if [ -f massif.out ]; then
            ms_print massif.out > massif-summary.txt
            head -120 massif-summary.txt
          fi
